bt_nodes:
  - name: "Speak"
    type: "Action"
    description: "Speaks the provided text using TTS."
    ports:
      - name: "text"
        direction: "Input"
        type: "string"
        description: "Text to be spoken (required). Can be a hardcoded literal (e.g. <Speak text=\"Hello!\"/>) or a blackboard reference written by a previous node (e.g. <Speak text=\"{extracted_info}\"/>). The value must be set at runtime — never use a blackboard reference that has not been written yet."
    return:
      SUCCESS: "Speaks the text provided."
      FAILURE: "The required 'text' input port is missing."

  - name: "Listen"
    type: "Action"
    description: "Listens to the user and captures their speech. Writes the recognized transcription to the output port."
    ports:
      - name: "timeout"
        direction: "Input"
        type: "int"
        description: "Listening timeout in ms (optional, default: 5000)."
      - name: "speech"
        direction: "Output"
        type: "string"
        description: "Transcribed speech from the user."
    return:
      SUCCESS: "Writes the recognized transcription to the 'speech' output port."

  - name: "Confirm"
    type: "Action"
    description: "Asks the user a yes/no question and returns the confirmation result."
    ports:
      - name: "text"
        direction: "Input"
        type: "string"
        description: "Confirmation prompt to show or ask the user (required). Can be a hardcoded literal (e.g. <Confirm text=\"Is that correct?\"/>) or a blackboard reference written by a previous node. The value must be set at runtime — never use a blackboard reference that has not been written yet."
      - name: "confirmed"
        direction: "Output"
        type: "string"
        description: "User confirmation result ('true' or 'false')."
    return:
      SUCCESS: "Writes the confirmation result ('true' or 'false') to the 'confirmed' output port."
      FAILURE: "The required 'text' input port is missing."

  - name: "Ask"
    type: "Action"
    description: "Asks the user an open-ended question and captures their answer."
    ports:
      - name: "question"
        direction: "Input"
        type: "string"
        description: "Question to ask the user (required). Can be a hardcoded literal (e.g. <Ask question=\"What would you like to order?\" answer=\"{customer_order}\"/>) or a blackboard reference written by a previous node. The value must be set at runtime — never use a blackboard reference that has not been written yet."
      - name: "answer"
        direction: "Output"
        type: "string"
        description: "The user's answer."
    return:
      SUCCESS: "Writes the user's answer to the 'answer' output port."
      FAILURE: "The required 'question' input port is missing."

  - name: "NavigateTo"
    type: "Action"
    description: "Navigates the robot to a named location or to map coordinates."
    ports:
      - name: "target"
        direction: "Input"
        type: "string"
        description: "Destination name (e.g. 'kitchen', 'entrance') or blackboard reference (e.g. '{customer_location}') (required). The blackboard reference must be written by a previous node before this one runs."
      - name: "x"
        direction: "Input"
        type: "double"
        description: "X coordinate in metres (optional, default: 0.0)."
      - name: "y"
        direction: "Input"
        type: "double"
        description: "Y coordinate in metres (optional, default: 0.0)."
    return:
      SUCCESS: "Reaches the destination and signals completion."
      FAILURE: "The required 'target' input port is missing or its blackboard reference is unset."

  - name: "Follow"
    type: "Action"
    description: "Makes the robot follow a target entity (person, object, etc.)."
    ports:
      - name: "target"
        direction: "Input"
        type: "string"
        description: "Entity name or frame id to follow (e.g. 'person_1') (required)."
    return:
      SUCCESS: "Follows the target entity."
      FAILURE: "The required 'target' input port is missing."

  - name: "Wait"
    type: "Action"
    description: "Waits for a given number of seconds. Returns immediately without blocking."
    ports:
      - name: "seconds"
        direction: "Input"
        type: "double"
        description: "Duration to wait in seconds (optional, default: 1.0)."
    return:
      SUCCESS: "Waits for the requested duration."

  - name: "IsDetected"
    type: "Condition"
    description: "Checks whether a target entity is currently detected by the perception system. Writes the detected entity name to the optional 'detected_frame' output port so downstream nodes such as NavigateTo can use it as a navigation target."
    ports:
      - name: "target"
        direction: "Input"
        type: "string"
        description: "Target class or entity name to check (e.g. 'person', 'cup') (required)."
      - name: "detected_frame"
        direction: "Output"
        type: "string"
        description: "Writes the detected entity name (same as 'target') to the blackboard. Use this to pass the detected entity's location to NavigateTo. Example: <IsDetected target=\"customer\" detected_frame=\"{customer_location}\"/>"
    return:
      SUCCESS: "If the target is detected, writes its name to 'detected_frame'."
      FAILURE: "The required 'target' input port is missing."

  - name: "SetTarget"
    type: "Action"
    description: "Configures the perception system to search for a specific target class (e.g. 'person', 'bottle')."
    ports:
      - name: "target"
        direction: "Input"
        type: "string"
        description: "Target class name to activate in the perception system (e.g. 'person', 'bottle') (required)."
    return:
      SUCCESS: "Configures the perception system for the target class."
      FAILURE: "The required 'target' input port is missing."

  - name: "SpeakEnum"
    type: "Action"
    description: "Enumerates and speaks a list of items using TTS with proper conjunction."
    ports:
      - name: "text"
        direction: "Input"
        type: "string"
        description: "Comma-separated list of items to speak (required). Can be a hardcoded literal (e.g. <SpeakEnum text=\"soup,salad,water\"/>) or a blackboard reference written by a previous node (e.g. <SpeakEnum text=\"{full_order}\"/>). The value must be set at runtime — never use a blackboard reference that has not been written yet."
      - name: "separator"
        direction: "Input"
        type: "string"
        description: "Item separator (default: ',')."
      - name: "language"
        direction: "Input"
        type: "string"
        description: "Language for final conjunction: 'en' or 'es' (default: 'en')."
    return:
      SUCCESS: "Speaks the enumerated items."
      FAILURE: "The required 'text' input port is missing or contains no items."

  - name: "Extract"
    type: "Action"
    description: "Extracts information of interest from a text using an LLM service."
    ports:
      - name: "interest"
        direction: "Input"
        type: "string"
        description: "Information to extract (e.g. 'order', 'name') (required)."
      - name: "text"
        direction: "Input"
        type: "string"
        description: "Source text to extract from (required)."
      - name: "extracted_info"
        direction: "Output"
        type: "string"
        description: "The extracted information."
    return:
      SUCCESS: "Writes the extracted information to 'extracted_info'."
      FAILURE: "Required inputs 'interest' or 'text' are missing."

  - name: "FollowDynamic"
    type: "Action"
    description: "Follows a person with dynamic speed and distance adjustments."
    ports:
      - name: "target_frame"
        direction: "Input"
        type: "string"
        description: "Target TF frame to follow (optional, default: target)."
      - name: "base_frame"
        direction: "Input"
        type: "string"
        description: "Base TF frame (optional, default: base_link)."
      - name: "min_distance"
        direction: "Input"
        type: "float"
        description: "Desired following distance in metres (optional, default: 1.0)."
      - name: "succeed_on_reach"
        direction: "Input"
        type: "bool"
        description: "Return SUCCESS when target is within min_distance (optional, default: false)."
    return:
      SUCCESS: "Follows the target frame with dynamic adjustments."

  - name: "SpinSearch"
    type: "Action"
    description: "Initiates a continuous spinning motion to scan the environment. As a non-terminating action that rotates the robot incrementally per tick and always yields RUNNING, it functions as a background maneuver that relies on parent reactive nodes to run concurrently with target detection conditions."
    ports:
      - name: "angular_speed"
        direction: "Input"
        type: "float"
        description: "Angular speed in rad/s (optional, default: 0.5)."
    return:
      SUCCESS: "Spins in place to search for targets."

  - name: "SetRos2Param"
    type: "Action"
    description: "Sets a parameter on a ROS 2 node."
    ports:
      - name: "node_name"
        direction: "Input"
        type: "string"
        description: "Name of the ROS 2 node (required)."
      - name: "param_name"
        direction: "Input"
        type: "string"
        description: "Parameter name (required)."
      - name: "param_value"
        direction: "Input"
        type: "string"
        description: "Parameter value (required)."
      - name: "param_type"
        direction: "Input"
        type: "string"
        description: "Parameter type: string, int, double, bool (optional, default: string)."
      - name: "success"
        direction: "Output"
        type: "bool"
        description: "Whether the operation succeeded."
    return:
      SUCCESS: "Sets the parameter and signals success."
      FAILURE: "Required inputs 'node_name', 'param_name', or 'param_value' are missing."
