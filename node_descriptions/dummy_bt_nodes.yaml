bt_nodes:
  - name: "Speak"
    type: "Action"
    description: "Speaks the provided text using TTS."
    ports:
      - name: "text"
        direction: "Input"
        type: "string"
        description: "Text to be spoken (required). Can be a hardcoded literal (e.g. <Speak text=\"Hello!\"/>) or a blackboard reference written by a previous node (e.g. <Speak text=\"{extracted_info}\"/>). The value must be set at runtime — never use a blackboard reference that has not been written yet."
    return:
      SUCCESS: "Speaks the text provided."
      FAILURE: "The required 'text' input port is missing."

  - name: "YesNo"
    type: "Action"
    description: "Asks the user a yes/no question, captures the reply, and returns the confirmation result in one node. Use this as a complete ask-for-confirmation interaction; do not add an extra Listen node for the same yes/no exchange unless the interaction is intentionally split across steps."
    ports:
      - name: "text"
        direction: "Input"
        type: "string"
        description: "Confirmation prompt to show or ask the user (required). Can be a hardcoded literal (e.g. <YesNo text=\"Is that correct?\"/>) or a blackboard reference written by a previous node. The value must be set at runtime — never use a blackboard reference that has not been written yet."
      - name: "confirmed"
        direction: "Output"
        type: "string"
        description: "User confirmation result ('true' or 'false')."
    return:
      SUCCESS: "Writes the confirmation result ('true' or 'false') to the 'confirmed' output port."
      FAILURE: "The required 'text' input port is missing."

  - name: "Ask"
    type: "Action"
    description: "Asks the user an open-ended question and captures the answer in one node. Use this when the robot needs a new free-form response from the user."
    ports:
      - name: "question"
        direction: "Input"
        type: "string"
        description: "Question to ask the user (required). Can be a hardcoded literal (e.g. <Ask question=\"What would you like instead?\"/>) or a blackboard reference written by a previous node. The value must be set at runtime — never use a blackboard reference that has not been written yet."
      - name: "answer"
        direction: "Output"
        type: "string"
        description: "User answer captured by the node."
    return:
      SUCCESS: "Writes the captured user answer to the 'answer' output port."
      FAILURE: "The required 'question' input port is missing."

  - name: "NavigateTo"
    type: "Action"
    description: "Navigates the robot to a named location or to map coordinates."
    ports:
      - name: "target"
        direction: "Input"
        type: "string"
        description: "Destination name (e.g. 'kitchen', 'entrance') or blackboard reference (e.g. '{customer_location}') (required). The blackboard reference must be written by a previous node before this one runs."
      - name: "x"
        direction: "Input"
        type: "double"
        description: "X coordinate in metres (optional, default: 0.0)."
      - name: "y"
        direction: "Input"
        type: "double"
        description: "Y coordinate in metres (optional, default: 0.0)."
    return:
      SUCCESS: "Reaches the destination and signals completion."
      FAILURE: "The required 'target' input port is missing or its blackboard reference is unset."

  - name: "Wait"
    type: "Action"
    description: "Waits for a given number of seconds. Returns immediately without blocking."
    ports:
      - name: "seconds"
        direction: "Input"
        type: "double"
        description: "Duration to wait in seconds (optional, default: 1.0)."
    return:
      SUCCESS: "Waits for the requested duration."

  - name: "IsDetected"
    type: "Condition"
    description: "Checks whether a target TF frame is currently detectable from a base frame using TF transforms. Intended to validate that the perception target (previously set) is currently present before downstream actions."
    ports:
      - name: "target_frame"
        direction: "Input"
        type: "string"
        description: "Target TF frame to check (optional, default: target)."
      - name: "base_frame"
        direction: "Input"
        type: "string"
        description: "Base TF frame to use as reference (optional, default: base_link)."
      - name: "timeout"
        direction: "Input"
        type: "double"
        description: "Maximum wait/staleness threshold in seconds (optional, default: 0.5)."
      - name: "detected_frame"
        direction: "Output"
        type: "string"
        description: "Writes the detected frame (same as target_frame) to the blackboard for downstream nodes."
    return:
      SUCCESS: "Target frame is detected and recent; writes 'detected_frame' to the blackboard."
      FAILURE: "Target frame is not detected, stale, or a required input port cannot be resolved."

  - name: "SetPerceptionTarget"
    type: "Action"
    description: "Configures the perception system to search for a specific target class. The target MUST be a standard YOLO class label (e.g. 'person', 'cup', 'bottle', 'chair') and must not be a custom/free-text entity name. Should be only used once per target class at the start of a behavior sequence, never repeatedly in a loop (do not use within reactive behaviors or sequences within reactive behaviors). This node only sets the target for downstream perception nodes that check for TF frames corresponding to that class."
    ports:
      - name: "target"
        direction: "Input"
        type: "string"
        description: "Target class name to activate in the perception system (required). Must be a standard YOLO class label; do not use custom entity names like customer_1 or waiter_john."
    return:
      SUCCESS: "Configures the perception system for the target class."
      FAILURE: "The required 'target' input port is missing."

  - name: "Extract"
    type: "Action"
    description: "Extracts exactly one semantic information field from a text using an LLM service (e.g. dish, drink, person name). This node is single-field per call: set 'interest' to one target (e.g. 'name' OR 'drink'). If you need multiple fields, chain multiple Extract nodes sequentially, one per field, each writing to its own output variable. This node is intended for semantic field extraction from text, not for map frame resolution."
    ports:
      - name: "interest"
        direction: "Input"
        type: "string"
        description: "Single information field to extract (required). Do not provide a comma-separated list of fields."
      - name: "text"
        direction: "Input"
        type: "string"
        description: "Source text to extract from (required)."
      - name: "extracted_info"
        direction: "Output"
        type: "string"
        description: "The extracted value for the single requested field."
    return:
      SUCCESS: "Writes the extracted information to 'extracted_info'."
      FAILURE: "Required inputs 'interest' or 'text' are missing."

  - name: "Spin"
    type: "Action"
    description: "Publishes in-place rotation commands on every tick and always returns RUNNING. The node does not reach completion by itself; it is halted externally when the search succeeds or times out."
    ports:
      - name: "angular_speed"
        direction: "Input"
        type: "float"
        description: "Angular speed for spinning in rad/s (optional, default: 0.5)."
      - name: "cmd_vel_topic"
        direction: "Input"
        type: "string"
        description: "Velocity command topic (optional, default: /cmd_vel)."
      - name: "touch_topic"
        direction: "Input"
        type: "string"
        description: "Touch sensor topic (optional, default: /sensors/touch)."
    return:
      RUNNING: "Publishes angular velocity commands on every tick to keep rotating in place."

  - name: "IsAvailable"
    type: "Condition"
    description: "Checks whether a list of requested items are available. Returns SUCCESS if all items are available and FAILURE if any item is unavailable. Use as a boolean condition inside control flow (e.g. Fallback). When SUCCESS, the same 'items' input variable already holds the confirmed value — do NOT create separate output variables for the confirmed items. Optionally writes the list of unavailable items to 'unavailable_items'."
    ports:
      - name: "available_items"
        direction: "Input"
        type: "string"
        description: "Semicolon-separated list of available items (e.g. 'pizza;steak;water') (required). Can be a hardcoded literal or a blackboard reference written by a previous node."
      - name: "items"
        direction: "Input"
        type: "string"
        description: "Requested item(s) to check for availability (required). Can be a hardcoded literal or a blackboard reference. On SUCCESS, this same variable is ready to use downstream."
      - name: "unavailable_items"
        direction: "Output"
        type: "string"
        description: "Semicolon-separated list of unavailable items (optional). Only useful to mention to the user in a recovery branch."
    return:
      SUCCESS: "All requested items are available."
      FAILURE: "At least one requested item is unavailable. If 'unavailable_items' is provided, writes the list of unavailable items to it."

  - name: "GetNavLocation"
    type: "Action"
    description: "Given a description of the location, gets the frame corresponding to that location for navigation purposes. This node resolves a human-provided location description into a known navigation frame in the map. For example, if the robot receives an open-ended location description from the user (e.g. 'the table near the window'), this node determines a frame like 'table_3'. The resulting frame is written to the 'location_frame' output port for use in navigation nodes (typically passed to NavigateTo target)."
    ports:
      - name: "location_description"
        direction: "Input"
        type: "string"
        description: "Description of the location to navigate to (required). Can be a hardcoded literal or a blackboard reference written by a previous node."
      - name: "location_frame"
        direction: "Output"
        type: "string"
        description: "The navigation frame corresponding to the location description."
    return:
      SUCCESS: "Writes the navigation frame corresponding to the location description to 'location_frame'."
      FAILURE: "The required 'location_description' input port is missing or the description cannot be matched to a known location."

  - name: "GetBearing"
    type: "Action"
    description: "Calculates the bearing (angle) to a target TF frame relative to a base frame and writes it to the blackboard. Use this node when you need the angle to a target for downstream decision-making."
    ports:
      - name: "target_frame"
        direction: "Input"
        type: "string"
        description: "Target TF frame to calculate bearing to"
      - name: "base_frame"
        direction: "Input"
        type: "string"
        description: "Base TF frame for reference (optional, default: base_link)."
      - name: "timeout"
        direction: "Input"
        type: "double"
        description: "Maximum wait/staleness threshold in seconds for the target transform (optional, default: 0.5)."
      - name: "bearing"
        direction: "Output"
        type: "double"
        description: "Calculated bearing angle in radians written to the blackboard for downstream use."
    return:
      SUCCESS: "Writes the calculated bearing angle to 'bearing'."
      FAILURE: "Target transform is missing/stale or a required port cannot be resolved."

  - name: "GetDistance"
    type: "Action"
    description: "Calculates the distance to a target TF frame from a base frame and writes it to the blackboard. Use this node when you need the distance to a target for downstream decision-making."
    ports:
      - name: "target_frame"
        direction: "Input"
        type: "string"
        description: "Target TF frame to calculate distance to."
      - name: "base_frame"
        direction: "Input"
        type: "string"
        description: "Base TF frame for reference (optional, default: base_link)."
      - name: "timeout"
        direction: "Input"
        type: "double"
        description: "Maximum wait/staleness threshold in seconds for the target transform (optional, default: 0.5)."
      - name: "distance"
        direction: "Output"
        type: "double"
        description: "Calculated distance in metres written to the blackboard for downstream use."
    return:
      SUCCESS: "Writes the calculated distance to 'distance'."
      FAILURE: "Target transform is missing/stale or a required port cannot be resolved."

  - name: "IsFacing"
    type: "Condition"
    description: "Checks if the robot is facing a target TF frame within a specified angular threshold. Use this node to validate that the robot is oriented towards a target before performing actions that require facing (e.g. speaking, offering an item)."
    ports:
      - name: "target_frame"
        direction: "Input"
        type: "string"
        description: "Target TF frame to check if facing."
      - name: "base_frame"
        direction: "Input"
        type: "string"
        description: "Base TF frame for reference (optional, default: base_link)."
      - name: "angle_threshold"
        direction: "Input"
        type: "double"
        description: "Angular threshold in radians for considering 'facing' (optional, default: 0.5)."
      - name: "timeout"
        direction: "Input"
        type: "double"
        description: "Maximum wait/staleness threshold in seconds for the target transform (optional, default: 0.5)."
    return:
      SUCCESS: "The robot is facing the target within the specified angular threshold."
      FAILURE: "The robot is not facing the target or the target transform is missing/stale."

  - name: "IsWithinDistance"
    type: "Condition"
    description: "Checks if the robot is within a specified distance to a target TF frame. Use this node to validate proximity to a target before performing actions that require being close (e.g. picking up an item, interacting with a person)."
    ports:
      - name: "target_frame"
        direction: "Input"
        type: "string"
        description: "Target TF frame to check distance to."
      - name: "base_frame"
        direction: "Input"
        type: "string"
        description: "Base TF frame for reference (optional, default: base_link)."
      - name: "distance_threshold"
        direction: "Input"
        type: "double"
        description: "Distance threshold in metres for considering 'within distance' (optional, default: 1.0)."
      - name: "timeout"
        direction: "Input"
        type: "double"
        description: "Maximum wait/staleness threshold in seconds for the target transform (optional, default: 0.5)."
    return:
      SUCCESS: "The robot is within the specified distance to the target."
      FAILURE: "The robot is not within the specified distance or the target transform is missing/stale."

  - name: "MoveForward"
    type: "Action"
    description: "Moves the robot forward by a specified distance. Use this node to navigate the robot in a straight line."
    ports:
      - name: "speed"
        direction: "Input"
        type: "double"
        description: "Speed at which to move forward in metres per second (optional, default: 0.5)."
    return:
      SUCCESS: "A velocity command has been sent to move the robot forward."
      FAILURE: "Failed to move forward or the required port cannot be resolved."

  - name: "RotateToBearing"
    type: "Action"
    description: "Rotates the robot in place to face a target bearing angle. Use this node to orient the robot towards a specific direction."
    ports:
      - name: "bearing"
        direction: "Input"
        type: "double"
        description: "Target bearing angle in radians to rotate towards (required)."
      - name: "angular_speed"
        direction: "Input"
        type: "double"
        description: "Angular speed for rotation in rad/s (optional, default: 0.5)."
    return:
      SUCCESS: "A velocity command has been sent to rotate the robot towards the target bearing."
      FAILURE: "Failed to rotate or the required 'bearing' port cannot be resolved."

  - name: "StopCurrentTask"
    type: "Condition"
    description: "Checks if the robot's current task has to be stopped. This node is intended to be used as a recovery condition that can be triggered by an external event (e.g. user command, safety sensor) to interrupt the robot's ongoing behavior and return control to the main loop for replanning. When this condition returns SUCCESS, the current task should be halted immediately. When it returns FAILURE, the current task continues as normal."
    return:
      SUCCESS: "The robot's current task has to be stopped."
      FAILURE: "The robot's current task does not need to be stopped." 